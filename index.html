<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- ================================================== -->
<!--  แก้ 4 บรรทัดนี้ทุกครั้งที่ทำสินค้าใหม่              -->
<!-- ================================================== -->
<title>iPhone 17 Pro Max ลดแรงมาก</title>
<meta property="og:title"       content="iPhone 17 Pro Max ลดแรงมาก">
<meta property="og:description" content="ร้าน OFFICIAL พาร์ทเนอร์ Apple โดยตรง ส่งไว">
<meta property="og:image"       content="https://ชื่อเว็บเรา/cover.jpg">
<script>
  // ใส่ลิงก์ affiliate ของเราตรงนี้
  var SHOP_URL = "https://s.shopee.co.th/1LfrYg21az";
</script>
<!-- ================================================== -->

<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="iPhone 17 Pro Max ลดแรงมาก">
<meta name="twitter:description" content="ร้าน OFFICIAL พาร์ทเนอร์ Apple โดยตรง ส่งไว">
<meta name="twitter:image" content="https://ชื่อเว็บเรา/cover.jpg">
<meta name="robots" content="noindex">

<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 24px;
    font-family: "Noto Sans Thai", "Sarabun", system-ui, -apple-system, sans-serif;
    background: #ffffff;
    color: #1c1c1c;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #131313; color: #f2f2f2; }
  }
  main { text-align: center; max-width: 24rem; }
  .dot {
    width: 34px; height: 34px;
    margin: 0 auto 20px;
    border-radius: 50%;
    border: 3px solid currentColor;
    border-top-color: transparent;
    opacity: .5;
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
  p { font-size: 1.0625rem; line-height: 1.6; margin: 0 0 20px; }
  a {
    display: inline-block;
    padding: 12px 22px;
    border-radius: 999px;
    background: #ee4d2d;
    color: #fff;
    font-weight: 600;
    text-decoration: none;
  }
  a:focus-visible { outline: 3px solid #1c1c1c; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <div class="dot" aria-hidden="true"></div>
  <p>กำลังพาไปที่หน้าสินค้าใน Shopee</p>
  <a id="go" href="#">เปิดหน้าสินค้าเลย</a>
</main>

<script>
  // ตั้งปุ่มสำรอง เผื่อเบราว์เซอร์บล็อกการเด้งอัตโนมัติ
  document.getElementById("go").href = SHOP_URL;
  // หน่วง 400ms ให้บอตของ X อ่าน meta tag ได้ครบก่อน
  setTimeout(function () { window.location.replace(SHOP_URL); }, 400);
</script>
</body>
</html>
